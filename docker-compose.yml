services:
    postgres:
        image: postgres:16-alpine
        container_name: patchwork-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: patchwork
            POSTGRES_USER: patchwork
            POSTGRES_PASSWORD: ${PATCHWORK_POSTGRES_PASSWORD:?Set PATCHWORK_POSTGRES_PASSWORD in .env}
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U patchwork -d patchwork']
            interval: 5s
            timeout: 3s
            retries: 20
        volumes:
            - patchwork-postgres-data:/var/lib/postgresql/data
        networks:
            internal:

    patchwork-api:
        image: ${PATCHWORK_API_IMAGE:-patchwork-api:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: api-runtime
        container_name: patchwork-api
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            patchwork-api-migrations:
                condition: service_completed_successfully
            patchwork-indexer-migrations:
                condition: service_completed_successfully
            patchwork-spool:
                condition: service_healthy
            patchwork-thimble:
                condition: service_healthy
            patchwork-objects:
                condition: service_healthy
            patchwork-clamav:
                condition: service_healthy
        environment:
            NODE_ENV: production
            PATCHWORK_ENV: production
            LOG_LEVEL: ${LOG_LEVEL:-info}
            ATPROTO_SERVICE_DID: ${ATPROTO_SERVICE_DID:?Set a real ATPROTO_SERVICE_DID}
            ATPROTO_PDS_URL: ${ATPROTO_PDS_URL:-https://bsky.social}
            ATPROTO_ACCOUNT_PDS_URL: ${ATPROTO_ACCOUNT_PDS_URL:?Set private PDS origin}
            ATPROTO_OAUTH_CLIENT_ID: ${ATPROTO_OAUTH_CLIENT_ID:?Set ATPROTO_OAUTH_CLIENT_ID}
            ATPROTO_OAUTH_REDIRECT_URI: ${ATPROTO_OAUTH_REDIRECT_URI:?Set ATPROTO_OAUTH_REDIRECT_URI}
            ATPROTO_SESSION_ENCRYPTION_KEY: ${ATPROTO_SESSION_ENCRYPTION_KEY:?Set ATPROTO_SESSION_ENCRYPTION_KEY}
            API_HOST: 0.0.0.0
            API_PORT: 4000
            API_PUBLIC_ORIGIN: ${PATCHWORK_PUBLIC_ORIGIN:?Set PATCHWORK_PUBLIC_ORIGIN}
            API_TRUSTED_PROXIES: ${API_TRUSTED_PROXIES:?Set API_TRUSTED_PROXIES to your trusted proxy IPs/CIDRs before starting production.}
            API_MAX_PROJECTION_LAG_SECONDS: ${API_MAX_PROJECTION_LAG_SECONDS:-300}
            API_RETENTION_INTERVAL_SECONDS: ${API_RETENTION_INTERVAL_SECONDS:-3600}
            API_DATA_SOURCE: postgres
            API_DATABASE_URL: postgresql://patchwork:${PATCHWORK_POSTGRES_PASSWORD:?Set PATCHWORK_POSTGRES_PASSWORD in .env}@patchwork-postgres:5432/patchwork
            API_MODERATION_SERVICE_URL: http://patchwork-thimble:4200
            MODERATION_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN:?Set MODERATION_SERVICE_TOKEN in .env}
            API_ATTACHMENT_INTERVAL_SECONDS: ${API_ATTACHMENT_INTERVAL_SECONDS:-30}
            ATTACHMENT_OBJECT_ENDPOINT: http://patchwork-objects:9000
            ATTACHMENT_OBJECT_ACCESS_KEY: ${PATCHWORK_ATTACHMENT_ACCESS_KEY:?Set PATCHWORK_ATTACHMENT_ACCESS_KEY in .env}
            ATTACHMENT_OBJECT_SECRET_KEY: ${PATCHWORK_ATTACHMENT_SECRET_KEY:?Set PATCHWORK_ATTACHMENT_SECRET_KEY in .env}
            ATTACHMENT_OBJECT_BUCKET: patchwork-private-attachments
            ATTACHMENT_SIGNING_KEY: ${PATCHWORK_ATTACHMENT_SIGNING_KEY:?Set PATCHWORK_ATTACHMENT_SIGNING_KEY in .env}
            ATTACHMENT_CLAMD_HOST: patchwork-clamav
            ATTACHMENT_CLAMD_PORT: 3310
            API_NOTIFICATION_INTERVAL_SECONDS: ${API_NOTIFICATION_INTERVAL_SECONDS:-15}
            NOTIFICATION_EMAIL_PROVIDER_URL: ${NOTIFICATION_EMAIL_PROVIDER_URL:?Set NOTIFICATION_EMAIL_PROVIDER_URL in .env}
            NOTIFICATION_EMAIL_PROVIDER_TOKEN: ${NOTIFICATION_EMAIL_PROVIDER_TOKEN:?Set NOTIFICATION_EMAIL_PROVIDER_TOKEN in .env}
            NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:?Set NOTIFICATION_EMAIL_FROM in .env}
            NOTIFICATION_VAPID_SUBJECT: ${NOTIFICATION_VAPID_SUBJECT:?Set NOTIFICATION_VAPID_SUBJECT in .env}
            NOTIFICATION_VAPID_PUBLIC_KEY: ${NOTIFICATION_VAPID_PUBLIC_KEY:?Set NOTIFICATION_VAPID_PUBLIC_KEY in .env}
            NOTIFICATION_VAPID_PRIVATE_KEY: ${NOTIFICATION_VAPID_PRIVATE_KEY:?Set NOTIFICATION_VAPID_PRIVATE_KEY in .env}
            NOTIFICATION_PROVIDER_WEBHOOK_TOKEN: ${NOTIFICATION_PROVIDER_WEBHOOK_TOKEN:?Set NOTIFICATION_PROVIDER_WEBHOOK_TOKEN in .env}
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health/ready >/dev/null']
            interval: 10s
            timeout: 3s
            retries: 18
        networks:
            internal:
            web:
                aliases:
                    - patchwork-api
                    - patchwork-stitch

    patchwork-spool:
        image: ${PATCHWORK_INDEXER_IMAGE:-patchwork-indexer:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: indexer-runtime
        container_name: patchwork-spool
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4100/health/ready >/dev/null']
            interval: 10s
            timeout: 3s
            retries: 12
        depends_on:
            postgres:
                condition: service_healthy
            patchwork-indexer-migrations:
                condition: service_completed_successfully
            patchwork-api-migrations:
                condition: service_completed_successfully
        environment:
            NODE_ENV: production
            PATCHWORK_ENV: production
            LOG_LEVEL: ${LOG_LEVEL:-info}
            ATPROTO_SERVICE_DID: ${ATPROTO_SERVICE_DID:?Set a real ATPROTO_SERVICE_DID}
            ATPROTO_PDS_URL: ${ATPROTO_PDS_URL:-https://bsky.social}
            INDEXER_PORT: 4100
            INDEXER_FIREHOSE_URL: ${INDEXER_FIREHOSE_URL:-https://jetstream.us-east.bsky.network}
            INDEXER_JETSTREAM_VERSION: ${INDEXER_JETSTREAM_VERSION:-v2}
            INDEXER_PROJECTION_MODE: ${INDEXER_PROJECTION_MODE:-v2-live}
            JETSTREAM_API_KEY: ${JETSTREAM_API_KEY:?Set JETSTREAM_API_KEY for Jetstream v2}
            DATABASE_URL: postgresql://patchwork:${PATCHWORK_POSTGRES_PASSWORD:?Set PATCHWORK_POSTGRES_PASSWORD in .env}@patchwork-postgres:5432/patchwork
        networks:
            internal:
            web:
                aliases:
                    - patchwork-spool
                    - patchwork-quilt

    # Opt-in rebuild worker. It cannot address the live projection and is not
    # started by the default Compose profile.
    patchwork-v2-shadow:
        profiles: ['jetstream-v2-shadow']
        image: ${PATCHWORK_INDEXER_IMAGE:-patchwork-indexer:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: indexer-runtime
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4101/health/ready >/dev/null']
            interval: 10s
            timeout: 3s
            retries: 12
        depends_on:
            postgres:
                condition: service_healthy
            patchwork-indexer-migrations:
                condition: service_completed_successfully
            patchwork-api-migrations:
                condition: service_completed_successfully
        environment:
            NODE_ENV: production
            PATCHWORK_ENV: production
            LOG_LEVEL: ${LOG_LEVEL:-info}
            ATPROTO_SERVICE_DID: ${ATPROTO_SERVICE_DID:?Set a real ATPROTO_SERVICE_DID}
            ATPROTO_PDS_URL: ${ATPROTO_PDS_URL:-https://bsky.social}
            INDEXER_PORT: 4101
            INDEXER_FIREHOSE_URL: ${INDEXER_V2_URL:-https://jetstream.us-east.bsky.network}
            INDEXER_JETSTREAM_VERSION: v2
            INDEXER_PROJECTION_MODE: v2-shadow
            JETSTREAM_API_KEY: ${JETSTREAM_API_KEY:-}
            DATABASE_URL: postgresql://patchwork:${PATCHWORK_POSTGRES_PASSWORD:?Set PATCHWORK_POSTGRES_PASSWORD in .env}@patchwork-postgres:5432/patchwork
        networks:
            internal:

    patchwork-indexer-migrations:
        image: ${PATCHWORK_INDEXER_IMAGE:-patchwork-indexer:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: indexer-runtime
        restart: "no"
        command: ['npm', 'run', 'db:migrate', '-w', '@patchwork/indexer']
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            NODE_ENV: production
            ATPROTO_SERVICE_DID: ${ATPROTO_SERVICE_DID:?Set a real ATPROTO_SERVICE_DID}
            ATPROTO_PDS_URL: ${ATPROTO_PDS_URL:-https://bsky.social}
            DATABASE_URL: postgresql://patchwork:${PATCHWORK_POSTGRES_PASSWORD:?Set PATCHWORK_POSTGRES_PASSWORD in .env}@patchwork-postgres:5432/patchwork
        networks:
            internal:

    patchwork-objects:
        image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        container_name: patchwork-objects
        restart: unless-stopped
        command: ['server', '/data']
        environment:
            MINIO_ROOT_USER: ${PATCHWORK_ATTACHMENT_ACCESS_KEY:?Set PATCHWORK_ATTACHMENT_ACCESS_KEY in .env}
            MINIO_ROOT_PASSWORD: ${PATCHWORK_ATTACHMENT_SECRET_KEY:?Set PATCHWORK_ATTACHMENT_SECRET_KEY in .env}
        healthcheck:
            test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null']
            interval: 10s
            timeout: 5s
            retries: 18
        volumes:
            - patchwork-object-data:/data
        networks:
            internal:

    patchwork-clamav:
        image: clamav/clamav@sha256:6b7c8e09559250f25b0184516b0a2ae805136e57485260e16c780c9fd6e6aba9
        container_name: patchwork-clamav
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'clamdscan --ping 1 >/dev/null']
            interval: 30s
            timeout: 10s
            retries: 20
            start_period: 360s
        volumes:
            - patchwork-clamav-signatures:/var/lib/clamav
        networks:
            internal:

    patchwork-thimble:
        image: ${PATCHWORK_MODERATION_IMAGE:-patchwork-moderation:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: moderation-runtime
        container_name: patchwork-thimble
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PATCHWORK_ENV: production
            LOG_LEVEL: ${LOG_LEVEL:-info}
            ATPROTO_SERVICE_DID: ${ATPROTO_SERVICE_DID:?Set a real ATPROTO_SERVICE_DID}
            ATPROTO_PDS_URL: ${ATPROTO_PDS_URL:-https://bsky.social}
            DATABASE_URL: postgresql://patchwork:${PATCHWORK_POSTGRES_PASSWORD:?Set PATCHWORK_POSTGRES_PASSWORD in .env}@patchwork-postgres:5432/patchwork
            MODERATION_PORT: 4200
            MODERATION_WORKER_CONCURRENCY: ${MODERATION_WORKER_CONCURRENCY:-2}
            MODERATION_RETENTION_INTERVAL_SECONDS: ${MODERATION_RETENTION_INTERVAL_SECONDS:-3600}
            MODERATION_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN:?Set MODERATION_SERVICE_TOKEN in .env}
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4200/health/ready >/dev/null']
            interval: 10s
            timeout: 3s
            retries: 18
        depends_on:
            postgres:
                condition: service_healthy
            patchwork-moderation-migrations:
                condition: service_completed_successfully
        networks:
            internal:

    patchwork-moderation-migrations:
        image: ${PATCHWORK_MODERATION_IMAGE:-patchwork-moderation:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: moderation-runtime
        restart: "no"
        command: ['npm', 'run', 'db:migrate', '-w', '@patchwork/moderation-worker']
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            NODE_ENV: production
            ATPROTO_SERVICE_DID: ${ATPROTO_SERVICE_DID:?Set a real ATPROTO_SERVICE_DID}
            ATPROTO_PDS_URL: ${ATPROTO_PDS_URL:-https://bsky.social}
            DATABASE_URL: postgresql://patchwork:${PATCHWORK_POSTGRES_PASSWORD:?Set PATCHWORK_POSTGRES_PASSWORD in .env}@patchwork-postgres:5432/patchwork
        networks:
            internal:

    patchwork-api-migrations:
        image: ${PATCHWORK_API_IMAGE:-patchwork-api:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: api-runtime
        restart: "no"
        command: ['npm', 'run', 'db:migrate', '-w', '@patchwork/api']
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            NODE_ENV: production
            ATPROTO_SERVICE_DID: ${ATPROTO_SERVICE_DID:?Set a real ATPROTO_SERVICE_DID}
            ATPROTO_PDS_URL: ${ATPROTO_PDS_URL:-https://bsky.social}
            API_DATA_SOURCE: postgres
            API_DATABASE_URL: postgresql://patchwork:${PATCHWORK_POSTGRES_PASSWORD:?Set PATCHWORK_POSTGRES_PASSWORD in .env}@patchwork-postgres:5432/patchwork
        networks:
            internal:

    patchwork-web:
        image: ${PATCHWORK_WEB_IMAGE:-patchwork-web:local}
        build:
            context: .
            dockerfile: Dockerfile
            target: web-runtime
            args:
                VITE_APP_NAME: Patchwork
                VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL}
                VITE_DATA_MODE: api
                VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:?Set VITE_MAP_TILE_URL to the versioned tile URL}
        container_name: patchwork-web
        restart: unless-stopped
        depends_on:
            patchwork-api:
                condition: service_healthy
        environment:
            VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:?Set VITE_MAP_TILE_URL to the versioned tile URL}
        healthcheck:
            test: ['CMD-SHELL', 'test -r /srv/patchwork-map/${PATCHWORK_PM_TILES_FILENAME:?Set PATCHWORK_PM_TILES_FILENAME} && wget -qO- http://127.0.0.1/ >/dev/null']
            interval: 10s
            timeout: 3s
            retries: 12
        volumes:
            - type: bind
              source: ${PATCHWORK_PM_TILES_DIRECTORY:?Set PATCHWORK_PM_TILES_DIRECTORY to the host tile directory}
              target: /srv/patchwork-map
              read_only: true
              bind:
                  create_host_path: false
        networks:
            web:
                aliases:
                    - patchwork-web

volumes:
    patchwork-postgres-data:
    patchwork-object-data:
    patchwork-clamav-signatures:

networks:
    internal:
        driver: bridge
    web:
        external: true
