# Green pull requests merge themselves and main deploys to staging, so every
# ecosystem here ignores major versions, groups minor and patch updates into
# one pull request and keeps at most two open.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # The visual snapshots in apps/web/e2e belong to the Chromium build that
      # this Playwright version installs; update both together by hand.
      - dependency-name: '@playwright/test'
      # 0.x protocol and sign-in libraries: an update needs a manual sign-in
      # check on staging.
      - dependency-name: '@atproto/*'
      - dependency-name: '@bsky/jetstream'
      # Minor versions may change rendered output.
      - dependency-name: react
        update-types: ['version-update:semver-minor']
      - dependency-name: react-dom
        update-types: ['version-update:semver-minor']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-minor']
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-minor']
      - dependency-name: '@tailwindcss/vite'
        update-types: ['version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directories:
      - /
      - /deploy/ci
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
