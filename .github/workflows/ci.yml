name: CI

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    quality-gates:
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install dependencies
              run: npm ci --include=dev

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Unit tests
              run: npm run test

            - name: Operational controls and sprint traceability
              run: npm run test:operations

            - name: Diagnostic coverage report
              run: npm run test:coverage

            - name: Upload coverage report
              uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              if: always()
              with:
                  name: test-coverage
                  path: coverage/
                  retention-days: 14

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium
              working-directory: apps/web

            - name: Browser E2E tests (Phase 8.2)
              run: npm run test:e2e -w @patchwork/web

            - name: Refuse unreviewed browser artifacts
              if: always()
              run: npm run test:e2e:redact

            - name: Dependency vulnerability scan
              run: npm audit --audit-level=high

            - name: Hardcoded secrets check
              run: |
                  PATTERN='(POSTGRES_PASSWORD|password|secret_key|api_key|apikey)\s*[:=]\s*["\x27]?[a-zA-Z0-9]'
                  # Scan compose and env files for hardcoded secrets, excluding
                  # .env.example, docker-compose.postgres.yml (dev-only), and
                  # documentation / CI workflow files.
                  HITS=$(grep -riEn "$PATTERN" \
                    --include='*.yml' --include='*.yaml' --include='*.env' \
                    --exclude='.env.example' \
                    --exclude='docker-compose.postgres.yml' \
                    --exclude-dir='.github' \
                    --exclude-dir='docs' \
                    --exclude-dir='node_modules' \
                    . || true)
                  if [ -n "$HITS" ]; then
                    echo "::error::Possible hardcoded secrets detected:"
                    echo "$HITS"
                    exit 1
                  fi
                  echo "No hardcoded secrets found."

            - name: Build
              run: npm run build

            - name: Compute immutable image tag (#109)
              id: image-tag
              run: |
                  GIT_SHA=$(git rev-parse --short=7 HEAD)
                  BUILD_VERSION="0.9.0"
                  IMAGE_TAG="${BUILD_VERSION}-${GIT_SHA}"
                  echo "sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"
                  echo "version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
                  echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
                  echo "Image tag: ${IMAGE_TAG}"

            - name: Build Docker images with immutable tags (#109)
              run: |
                  docker build --target api-runtime \
                    --build-arg GIT_SHA=${{ steps.image-tag.outputs.sha }} \
                    --build-arg GIT_BRANCH=${{ github.ref_name }} \
                    --build-arg BUILD_VERSION=${{ steps.image-tag.outputs.version }} \
                    --build-arg CI_RUN_ID=${{ github.run_id }} \
                    -t patchwork-api:${{ steps.image-tag.outputs.tag }} \
                    -t patchwork-api:ci .
                  docker build --target web-runtime \
                    --build-arg GIT_SHA=${{ steps.image-tag.outputs.sha }} \
                    --build-arg GIT_BRANCH=${{ github.ref_name }} \
                    --build-arg BUILD_VERSION=${{ steps.image-tag.outputs.version }} \
                    --build-arg CI_RUN_ID=${{ github.run_id }} \
                    -t patchwork-web:${{ steps.image-tag.outputs.tag }} \
                    -t patchwork-web:ci .

            - name: Trivy container scan — API
              run: |
                  docker run --rm \
                    --volume /var/run/docker.sock:/var/run/docker.sock \
                    aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
                    image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
                    --format table patchwork-api:ci | tee trivy-api-report.txt

            - name: Trivy container scan — Web
              if: success() || failure()
              run: |
                  docker run --rm \
                    --volume /var/run/docker.sock:/var/run/docker.sock \
                    aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
                    image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
                    --format table patchwork-web:ci | tee trivy-web-report.txt

            - name: Upload security scan reports
              uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              if: always()
              with:
                  name: security-reports
                  path: |
                      trivy-api-report.txt
                      trivy-web-report.txt
                  retention-days: 30

    # -----------------------------------------------------------------------
    # Wave 3 (#99): Production-like E2E contract-path tests
    # -----------------------------------------------------------------------
    e2e-production:
        runs-on: ubuntu-latest
        needs: quality-gates
        timeout-minutes: 30

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: patchwork
                    POSTGRES_USER: patchwork
                    POSTGRES_PASSWORD: patchwork_ci
                options: >-
                    --health-cmd "pg_isready -U patchwork -d patchwork"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

        env:
            NODE_ENV: production
            API_DATA_SOURCE: postgres
            API_DATABASE_URL: postgresql://patchwork:patchwork_ci@postgres:5432/patchwork
            DATABASE_URL: postgresql://patchwork:patchwork_ci@postgres:5432/patchwork
            TEST_DATABASE_URL: postgresql://patchwork:patchwork_ci@postgres:5432/patchwork
            ATPROTO_SERVICE_DID: did:example:patchwork-ci
            ATPROTO_PDS_URL: https://bsky.social

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install dependencies
              run: npm ci --include=dev

            - name: Run database migrations
              run: |
                  npm run db:migrate -w @patchwork/api
                  npm run db:migrate -w @patchwork/indexer
                  npm run db:migrate -w @patchwork/moderation-worker

            - name: PostgreSQL integration tests
              run: npm run test:integration:postgres -w @patchwork/api

            - name: Direct lifecycle service integration tests
              run: npm run test:integration:service -w @patchwork/web

            - name: Indexer PostgreSQL integration tests
              run: npm run test -w @patchwork/indexer

            - name: Moderation PostgreSQL integration tests
              run: npm run test -w @patchwork/moderation-worker

            - name: Start private attachment integration services
              env:
                  ATTACHMENT_OBJECT_ACCESS_KEY: patchwork-ci
                  ATTACHMENT_OBJECT_SECRET_KEY: patchwork-ci-secret-key
              run: |
                  set -euo pipefail
                  docker compose -f docker-compose.postgres.yml up -d objects clamav
                  for container in patchwork-objects patchwork-clamav; do
                    for attempt in $(seq 1 90); do
                      status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
                      if [ "$status" = healthy ]; then break; fi
                      if [ "$status" = unhealthy ] || [ "$attempt" -eq 90 ]; then
                        docker logs "$container"
                        exit 1
                      fi
                      sleep 10
                    done
                  done

            - name: Private attachment provider integration tests
              env:
                  TEST_ATTACHMENT_OBJECT_ENDPOINT: http://127.0.0.1:9000
                  TEST_ATTACHMENT_OBJECT_ACCESS_KEY: patchwork-ci
                  TEST_ATTACHMENT_OBJECT_SECRET_KEY: patchwork-ci-secret-key
                  TEST_ATTACHMENT_OBJECT_BUCKET: patchwork-ci
                  TEST_ATTACHMENT_CLAMD_HOST: 127.0.0.1
                  TEST_ATTACHMENT_CLAMD_PORT: '3310'
              run: npm run test:integration:attachments -w @patchwork/api

            - name: Stop private attachment integration services
              if: always()
              run: docker compose -f docker-compose.postgres.yml down -v

    # -----------------------------------------------------------------------
    # Wave 4 (#108): Auto-deploy to staging on main push
    # -----------------------------------------------------------------------
    deploy-staging:
        runs-on: ubuntu-latest
        needs: [quality-gates, e2e-production]
        # Superseded by deploy-staging.yml after this CI workflow succeeds.
        if: ${{ false }}
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Compute immutable image tag (#109)
              id: image-tag
              run: |
                  GIT_SHA=$(git rev-parse --short=7 HEAD)
                  BUILD_VERSION="0.9.0"
                  IMAGE_TAG="${BUILD_VERSION}-${GIT_SHA}"
                  echo "sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"
                  echo "version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
                  echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

            - name: Build staging images with immutable tags (#109)
              run: |
                  docker build --target api-runtime \
                    --build-arg GIT_SHA=${{ steps.image-tag.outputs.sha }} \
                    --build-arg GIT_BRANCH=${{ github.ref_name }} \
                    --build-arg BUILD_VERSION=${{ steps.image-tag.outputs.version }} \
                    --build-arg CI_RUN_ID=${{ github.run_id }} \
                    -t patchwork-api:${{ steps.image-tag.outputs.tag }} .
                  docker build --target indexer-runtime \
                    --build-arg GIT_SHA=${{ steps.image-tag.outputs.sha }} \
                    --build-arg GIT_BRANCH=${{ github.ref_name }} \
                    --build-arg BUILD_VERSION=${{ steps.image-tag.outputs.version }} \
                    --build-arg CI_RUN_ID=${{ github.run_id }} \
                    -t patchwork-spool:${{ steps.image-tag.outputs.tag }} .
                  docker build --target moderation-runtime \
                    --build-arg GIT_SHA=${{ steps.image-tag.outputs.sha }} \
                    --build-arg GIT_BRANCH=${{ github.ref_name }} \
                    --build-arg BUILD_VERSION=${{ steps.image-tag.outputs.version }} \
                    --build-arg CI_RUN_ID=${{ github.run_id }} \
                    -t patchwork-thimble:${{ steps.image-tag.outputs.tag }} .
                  docker build --target web-runtime \
                    --build-arg GIT_SHA=${{ steps.image-tag.outputs.sha }} \
                    --build-arg GIT_BRANCH=${{ github.ref_name }} \
                    --build-arg BUILD_VERSION=${{ steps.image-tag.outputs.version }} \
                    --build-arg CI_RUN_ID=${{ github.run_id }} \
                    -t patchwork-web:${{ steps.image-tag.outputs.tag }} .

            - name: Verify OCI labels on built images (#109)
              run: |
                  TAG=${{ steps.image-tag.outputs.tag }}
                  for img in patchwork-api patchwork-spool patchwork-thimble patchwork-web; do
                    echo "--- ${img}:${TAG} labels ---"
                    docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${img}:${TAG}"
                    docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${img}:${TAG}"
                  done

            - name: Record artifact metadata (#109)
              run: |
                  TAG=${{ steps.image-tag.outputs.tag }}
                  SHA=${{ steps.image-tag.outputs.sha }}
                  VER=${{ steps.image-tag.outputs.version }}
                  cat <<ARTIFACT_EOF
                  {
                    "tag": "${TAG}",
                    "version": "${VER}",
                    "gitSha": "${SHA}",
                    "branch": "${{ github.ref_name }}",
                    "commitSha": "${{ github.sha }}",
                    "ciRunId": "${{ github.run_id }}",
                    "ciRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  }
                  ARTIFACT_EOF

            - name: Staging smoke checks (#108)
              run: |
                  echo "Legacy staging job is disabled; deploy-staging.yml owns deployment."
                  exit 1

    # -----------------------------------------------------------------------
    # Wave 4 (#110): Progressive delivery observability checkpoints
    # -----------------------------------------------------------------------
    progressive-delivery-gate:
        runs-on: ubuntu-latest
        needs: deploy-staging
        # Superseded by deployed readiness and browser gates in deploy-staging.yml.
        if: ${{ false }}
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Canary readiness checkpoint (#110)
              run: |
                  echo "=== Progressive Delivery Gate ==="
                  echo "Strategy: canary (5% -> 25% -> 50% -> 100%)"
                  echo ""
                  echo "Legacy simulated checkpoint job is disabled."
                  echo ""
                  echo "Burn-rate thresholds:"
                  echo "  error_rate: max 2.0x budget over 5m"
                  echo "  latency_p95: max 1.5x budget over 5m"
                  echo "  saturation: max 1.5x budget over 10m"
                  echo ""
                  exit 1

            - name: Rollback trigger configuration audit (#110)
              run: |
                  echo "=== Rollback Trigger Audit ==="
                  echo "Auto-rollback triggers configured:"
                  echo "  - SLO burn rate exceeded (error_rate > 2.0x)"
                  echo "  - SLO burn rate exceeded (latency_p95 > 1.5x)"
                  echo "  - Health check failure on canary pods"
                  echo "  - Smoke test failure after weight shift"
                  echo ""
                  echo "Manual override procedures:"
                  echo "  make deploy-rollout-pause SERVICE=<service>"
                  echo "  make deploy-rollout-resume SERVICE=<service>"
                  echo "  make deploy-rollout-abort SERVICE=<service>"
                  echo "  make rollback SERVICE=<service> ROLLBACK_TAG=<tag>"
                  echo ""
                  echo "Runbook: docs/operations/progressive-delivery-runbook.md"
