name: Native Android shell
on:
  pull_request:
    paths: ['apps/android/**', 'packages/mobile-contracts/**', 'packages/at-lexicons/src/*index.json', 'packages/at-lexicons/src/geography-names.json', 'scripts/*android_localization.py', 'docs/localization/android*', '.github/workflows/native-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native SDK platform
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Lint, unit test and build app and instrumentation APKs
        run: |
          python3 -B scripts/check_android_localization.py
          python3 -B -m unittest discover -s scripts -p 'test_android_localization.py'
          apps/android/gradlew -p apps/android --no-daemon \
            :app:lintDebug :app:testDebugUnitTest :app:testStagingUnitTest :app:assembleDebug \
            :app:assembleDebugAndroidTest :app:assembleStaging
