name: Deploy staging

on:
    workflow_dispatch:
        inputs:
            source_sha:
                description: Full current main SHA already accepted by Gitea CI
                required: true

permissions:
    contents: read
    actions: read

defaults:
    run:
        shell: bash

concurrency:
    group: patchwork-staging
    cancel-in-progress: false

env:
    REGISTRY: git.subcult.tv/subculture-collective
    SOURCE_SHA: ${{ inputs.source_sha }}
    STAGING_COMPOSE_PROJECT_NAME: ${{ vars.STAGING_COMPOSE_PROJECT_NAME }}
    STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
    STAGING_ENV_FILE: ${{ vars.STAGING_ENV_FILE }}
    STAGING_COSIGN_PUBLIC_KEY_PATH: ${{ vars.STAGING_COSIGN_PUBLIC_KEY_PATH }}
    STAGING_VITE_API_BASE_URL: ${{ vars.STAGING_VITE_API_BASE_URL }}
    STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
    STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}

jobs:
    preflight:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Require dispatch from Gitea main
              run: |
                  set -euo pipefail
                  [[ "$GITHUB_SERVER_URL" == https://git.subcult.tv ]]
                  [[ "$GITHUB_REPOSITORY" == subculture-collective/patchwork ]]
                  [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
                  [[ "$SOURCE_SHA" == "$GITHUB_SHA" ]]
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Verify manual source passed CI
              env:
                  GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
              run: bash scripts/verify-gitea-source.sh
            - name: Validate required configuration before building
              env:
                  STAGING_REGISTRY_TOKEN: ${{ secrets.STAGING_REGISTRY_TOKEN }}
                  STAGING_COSIGN_PRIVATE_KEY: ${{ secrets.STAGING_COSIGN_PRIVATE_KEY }}
                  STAGING_COSIGN_PASSWORD: ${{ secrets.STAGING_COSIGN_PASSWORD }}
                  STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
                  STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
                  STAGING_E2E_REQUESTER_STATE_B64: ${{ secrets.STAGING_E2E_REQUESTER_STATE_B64 }}
                  STAGING_E2E_HELPER_STATE_B64: ${{ secrets.STAGING_E2E_HELPER_STATE_B64 }}
                  STAGING_E2E_MAINTAINER_STATE_B64: ${{ secrets.STAGING_E2E_MAINTAINER_STATE_B64 }}
                  STAGING_E2E_EXACT_LATITUDE: ${{ secrets.STAGING_E2E_EXACT_LATITUDE }}
                  STAGING_E2E_EXACT_LONGITUDE: ${{ secrets.STAGING_E2E_EXACT_LONGITUDE }}
                  STAGING_E2E_PRIVATE_MARKER: ${{ secrets.STAGING_E2E_PRIVATE_MARKER }}
                  STAGING_ARTIFACT_REDACTION_TERMS: ${{ secrets.STAGING_ARTIFACT_REDACTION_TERMS }}
                  STAGING_REGISTRY_USERNAME: ${{ vars.STAGING_REGISTRY_USERNAME }}
                  STAGING_COSIGN_PUBLIC_KEY: ${{ vars.STAGING_COSIGN_PUBLIC_KEY }}
                  STAGING_PUBLIC_ORIGIN: ${{ vars.STAGING_PUBLIC_ORIGIN }}
                  STAGING_VITE_MAP_TILE_URL: ${{ vars.STAGING_VITE_MAP_TILE_URL }}
                  STAGING_E2E_EXERCISE_MAINTENANCE: ${{ vars.STAGING_E2E_EXERCISE_MAINTENANCE }}
              run: bash scripts/check-staging-workflow-config.sh
            - uses: sigstore/cosign-installer@v3
              with:
                  cosign-release: v2.5.2
            - name: Verify signing key pair
              env:
                  COSIGN_PRIVATE_KEY: ${{ secrets.STAGING_COSIGN_PRIVATE_KEY }}
                  COSIGN_PASSWORD: ${{ secrets.STAGING_COSIGN_PASSWORD }}
                  COSIGN_PUBLIC_KEY: ${{ vars.STAGING_COSIGN_PUBLIC_KEY }}
              run: |
                  set -euo pipefail
                  umask 077
                  cosign public-key --key env://COSIGN_PRIVATE_KEY > derived.pub
                  printf '%s\n' "$COSIGN_PUBLIC_KEY" > expected.pub
                  openssl pkey -pubin -in derived.pub -outform DER > derived.der
                  openssl pkey -pubin -in expected.pub -outform DER > expected.der
                  cmp derived.der expected.der
            - name: Configure staging SSH
              env:
                  STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
                  STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
              run: |
                  set -euo pipefail
                  install -d -m 0700 ~/.ssh
                  umask 077
                  printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
                  printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            - name: Check staging host prerequisites without changing services
              run: |
                  set -euo pipefail
                  remote="$STAGING_SSH_USER@$STAGING_SSH_HOST"
                  # Paths were validated above; expand them locally for the remote shell.
                  # shellcheck disable=SC2087
                  ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$remote" \
                    "bash -se" <<REMOTE
                  for command in docker jq cosign flock sha256sum; do command -v "\$command" >/dev/null; done
                  docker compose version >/dev/null
                  docker info >/dev/null
                  test -r '$STAGING_ENV_FILE'
                  test -d '$STAGING_DEPLOY_PATH' && test -w '$STAGING_DEPLOY_PATH'
                  test -d /var/lib/patchwork/releases && test -w /var/lib/patchwork/releases
                  test -r '$STAGING_COSIGN_PUBLIC_KEY_PATH'
                  for container in patchwork-staging-postgres patchwork-staging-api patchwork-staging-spool patchwork-staging-thimble patchwork-staging-web; do
                    if project=\$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "\$container" 2>/dev/null); then
                      [[ "\$project" == '$STAGING_COMPOSE_PROJECT_NAME' ]] || { echo 'Existing staging Compose project mismatch.' >&2; exit 1; }
                    fi
                  done
                  REMOTE
                  ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" \
                    "cat '$STAGING_COSIGN_PUBLIC_KEY_PATH'" > host.pub
                  openssl pkey -pubin -in host.pub -outform DER > host.der
                  cmp expected.der host.der
            - uses: docker/login-action@v3
              with:
                  registry: git.subcult.tv
                  username: ${{ vars.STAGING_REGISTRY_USERNAME }}
                  password: ${{ secrets.STAGING_REGISTRY_TOKEN }}
            - name: Remove preflight SSH identity
              if: always()
              run: rm -f ~/.ssh/id_ed25519

    publish:
        needs: preflight
        timeout-minutes: 45
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                include:
                    - service: api
                      image: patchwork-api
                      target: api-runtime
                    - service: indexer
                      image: patchwork-indexer
                      target: indexer-runtime
                    - service: moderation
                      image: patchwork-moderation
                      target: moderation-runtime
                    - service: web
                      image: patchwork-web
                      target: web-runtime
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.SOURCE_SHA }}
                  persist-credentials: false
            - uses: docker/login-action@v3
              with:
                  registry: git.subcult.tv
                  username: ${{ vars.STAGING_REGISTRY_USERNAME }}
                  password: ${{ secrets.STAGING_REGISTRY_TOKEN }}
            - uses: sigstore/cosign-installer@v3
              with:
                  cosign-release: v2.5.2
            - uses: anchore/sbom-action/download-syft@v0
            - name: Build once
              env:
                  STAGING_VITE_MAP_TILE_URL: ${{ vars.STAGING_VITE_MAP_TILE_URL }}
              run: |
                  set -euo pipefail
                  [[ "$STAGING_VITE_MAP_TILE_URL" =~ ^/tiles/us\.[0-9a-f]{64}\.pmtiles$ ]]
                  image="${REGISTRY}/${{ matrix.image }}:${SOURCE_SHA}"
                  docker build --target ${{ matrix.target }} \
                    --build-arg GIT_SHA="${SOURCE_SHA}" \
                    --build-arg GIT_BRANCH=main \
                    --build-arg BUILD_VERSION="${SOURCE_SHA::12}" \
                    --build-arg CI_RUN_ID="${GITHUB_RUN_ID}" \
                    --build-arg VITE_API_BASE_URL="$STAGING_VITE_API_BASE_URL" \
                    --build-arg VITE_DATA_MODE=api \
                    --build-arg VITE_MAP_TILE_URL="$STAGING_VITE_MAP_TILE_URL" \
                    -t "$image" .
            - name: Scan before publication
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ env.SOURCE_SHA }}
                  severity: HIGH,CRITICAL
                  exit-code: '1'
            - name: Generate SBOM and provenance predicates
              run: |
                  set -euo pipefail
                  image="${REGISTRY}/${{ matrix.image }}:${SOURCE_SHA}"
                  syft "$image" -o spdx-json="sbom-${{ matrix.service }}.spdx.json"
                  jq -n \
                    --arg source "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@${SOURCE_SHA}" \
                    --arg workflow "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                    --arg service '${{ matrix.service }}' \
                    '{
                      builder:{id:$workflow},
                      buildType:"https://git.subcult.tv/subculture-collective/patchwork/src/branch/main/.github/workflows/deploy-staging.yml",
                      invocation:{configSource:{uri:$source,digest:{sha1:env.SOURCE_SHA}},parameters:{service:$service}},
                      metadata:{buildInvocationId:$workflow,completeness:{parameters:true,environment:false,materials:true},reproducible:false},
                      materials:[{uri:$source,digest:{sha1:env.SOURCE_SHA}}]
                    }' > "provenance-${{ matrix.service }}.json"
            - name: Push, resolve digest, and sign
              env:
                  COSIGN_PRIVATE_KEY: ${{ secrets.STAGING_COSIGN_PRIVATE_KEY }}
                  COSIGN_PASSWORD: ${{ secrets.STAGING_COSIGN_PASSWORD }}
                  COSIGN_PUBLIC_KEY: ${{ vars.STAGING_COSIGN_PUBLIC_KEY }}
              run: |
                  set -euo pipefail
                  image="${REGISTRY}/${{ matrix.image }}:${SOURCE_SHA}"
                  docker push "$image"
                  digest_ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
                  [[ "$digest_ref" =~ @sha256:[0-9a-f]{64}$ ]]
                  printf '%s\n' "$COSIGN_PUBLIC_KEY" > cosign.pub
                  cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$digest_ref"
                  cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type spdxjson \
                    --predicate "sbom-${{ matrix.service }}.spdx.json" "$digest_ref"
                  cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type slsaprovenance \
                    --predicate "provenance-${{ matrix.service }}.json" "$digest_ref"
                  cosign verify --key cosign.pub "$digest_ref" >/dev/null
                  for attestation_type in spdxjson slsaprovenance; do
                    cosign verify-attestation --key cosign.pub "$digest_ref" \
                      --type "$attestation_type" >/dev/null
                  done
                  printf '%s' "$digest_ref" > "digest-${{ matrix.service }}.txt"
            - uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              with:
                  name: digest-${{ matrix.service }}
                  path: |
                      digest-${{ matrix.service }}.txt
                      sbom-${{ matrix.service }}.spdx.json
                      provenance-${{ matrix.service }}.json
                  if-no-files-found: error
                  retention-days: 14

    manifest:
        needs: publish
        runs-on: ubuntu-latest
        steps:
            - uses: https://gitea.com/actions/download-artifact@246d7188e736d3686f6d19628d253ede9697bd55
              with:
                  path: artifacts
            - name: Assemble digest manifest
              env:
                  STAGING_VITE_MAP_TILE_URL: ${{ vars.STAGING_VITE_MAP_TILE_URL }}
              run: |
                  set -euo pipefail
                  jq -n \
                    --arg sha "$SOURCE_SHA" \
                    --arg mapTileUrl "$STAGING_VITE_MAP_TILE_URL" \
                    --arg api "$(cat artifacts/digest-api/digest-api.txt)" \
                    --arg indexer "$(cat artifacts/digest-indexer/digest-indexer.txt)" \
                    --arg moderation "$(cat artifacts/digest-moderation/digest-moderation.txt)" \
                    --arg web "$(cat artifacts/digest-web/digest-web.txt)" \
                    '{gitSha:$sha,mapTileUrl:$mapTileUrl,images:{api:$api,indexer:$indexer,moderation:$moderation,web:$web}}' \
                    > artifact-digests.json
                  jq -e '.gitSha | test("^[0-9a-f]{40}$")' artifact-digests.json >/dev/null
                  jq -e '.mapTileUrl | test("^/tiles/us\\.[0-9a-f]{64}\\.pmtiles$")' artifact-digests.json >/dev/null
                  jq -e '.images[] | test("@sha256:[0-9a-f]{64}$")' artifact-digests.json >/dev/null
            - uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              with:
                  name: staging-artifact-digests
                  path: artifact-digests.json
                  if-no-files-found: error
                  retention-days: 30

    deploy:
        needs: manifest
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.SOURCE_SHA }}
                  persist-credentials: false
            - uses: https://gitea.com/actions/download-artifact@246d7188e736d3686f6d19628d253ede9697bd55
              with:
                  name: staging-artifact-digests
            - name: Recheck main and CI immediately before deployment
              env:
                  GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
              run: bash scripts/verify-gitea-source.sh
            - name: Configure staging SSH
              env:
                  STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
                  STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
              run: |
                  set -euo pipefail
                  install -d -m 0700 ~/.ssh
                  umask 077
                  printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
                  printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            - name: Transfer and deploy exact digests
              run: |
                  set -euo pipefail
                  [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
                  remote="$STAGING_SSH_USER@$STAGING_SSH_HOST"
                  destination="$STAGING_DEPLOY_PATH/run-$GITHUB_RUN_ID"
                  ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" "mkdir -p '$destination'"
                  scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
                    artifact-digests.json docker-compose.staging.yml \
                    scripts/deploy-staging-digests.sh scripts/rollback-staging-digests.sh \
                    scripts/verify-release-trust.sh scripts/run-staging-release.sh \
                    "$remote:$destination/"
                  ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" \
                    "cd '$destination' && chmod 0750 *.sh && \
                    COMPOSE_PROJECT_NAME='$STAGING_COMPOSE_PROJECT_NAME' \
                    PATCHWORK_RELEASE_VERIFY_MODE=key \
                    PATCHWORK_COSIGN_PUBLIC_KEY='$STAGING_COSIGN_PUBLIC_KEY_PATH' \
                    PATCHWORK_ALLOWED_IMAGE_PREFIX='${REGISTRY}/patchwork-' \
                    PATCHWORK_EXPECTED_WEB_API_BASE_URL='$STAGING_VITE_API_BASE_URL' \
                    ./run-staging-release.sh '$STAGING_ENV_FILE' '$STAGING_DEPLOY_PATH/.deploy.lock'"
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
              working-directory: apps/web
            - name: Real OAuth/PDS browser smoke
              env:
                  PATCHWORK_E2E_BASE_URL: ${{ vars.STAGING_PUBLIC_ORIGIN }}
                  PATCHWORK_E2E_REQUESTER_STATE_B64: ${{ secrets.STAGING_E2E_REQUESTER_STATE_B64 }}
                  PATCHWORK_E2E_HELPER_STATE_B64: ${{ secrets.STAGING_E2E_HELPER_STATE_B64 }}
                  PATCHWORK_E2E_EXACT_LATITUDE: ${{ secrets.STAGING_E2E_EXACT_LATITUDE }}
                  PATCHWORK_E2E_EXACT_LONGITUDE: ${{ secrets.STAGING_E2E_EXACT_LONGITUDE }}
                  PATCHWORK_E2E_PRIVATE_MARKER: ${{ secrets.STAGING_E2E_PRIVATE_MARKER }}
                  PATCHWORK_ARTIFACT_REDACTION_TERMS: ${{ secrets.STAGING_ARTIFACT_REDACTION_TERMS }}
              run: |
                  set -euo pipefail
                  umask 077
                  printf '%s' "$PATCHWORK_E2E_REQUESTER_STATE_B64" | base64 -d > requester-state.json
                  printf '%s' "$PATCHWORK_E2E_HELPER_STATE_B64" | base64 -d > helper-state.json
                  export PATCHWORK_E2E_REQUESTER_STATE="$PWD/requester-state.json"
                  export PATCHWORK_E2E_HELPER_STATE="$PWD/helper-state.json"
                  if ! npm run test:e2e -w @patchwork/web -- e2e/at-record-lifecycle.spec.ts; then
                    npm run test:e2e:redact
                    exit 1
                  fi
                  npm run test:e2e:redact

            - name: Non-mocked staging release lifecycle
              env:
                  PATCHWORK_E2E_BASE_URL: ${{ vars.STAGING_PUBLIC_ORIGIN }}
                  PATCHWORK_E2E_STAGING_LIFECYCLE: 'true'
                  PATCHWORK_E2E_EXERCISE_MAINTENANCE: ${{ vars.STAGING_E2E_EXERCISE_MAINTENANCE }}
                  PATCHWORK_E2E_DISCOVERY_LATITUDE: ${{ secrets.STAGING_E2E_EXACT_LATITUDE }}
                  PATCHWORK_E2E_DISCOVERY_LONGITUDE: ${{ secrets.STAGING_E2E_EXACT_LONGITUDE }}
                  PATCHWORK_E2E_REQUESTER_STATE_B64: ${{ secrets.STAGING_E2E_REQUESTER_STATE_B64 }}
                  PATCHWORK_E2E_HELPER_STATE_B64: ${{ secrets.STAGING_E2E_HELPER_STATE_B64 }}
                  PATCHWORK_E2E_MAINTAINER_STATE_B64: ${{ secrets.STAGING_E2E_MAINTAINER_STATE_B64 }}
                  PATCHWORK_ARTIFACT_REDACTION_TERMS: ${{ secrets.STAGING_ARTIFACT_REDACTION_TERMS }}
              run: |
                  set -euo pipefail
                  for required in \
                    PATCHWORK_E2E_BASE_URL \
                    PATCHWORK_E2E_DISCOVERY_LATITUDE \
                    PATCHWORK_E2E_DISCOVERY_LONGITUDE \
                    PATCHWORK_E2E_REQUESTER_STATE_B64 \
                    PATCHWORK_E2E_HELPER_STATE_B64 \
                    PATCHWORK_E2E_MAINTAINER_STATE_B64; do
                    if [ -z "${!required}" ]; then
                      echo "::error::Missing protected staging lifecycle input: ${required}"
                      exit 1
                    fi
                  done
                  umask 077
                  printf '%s' "$PATCHWORK_E2E_REQUESTER_STATE_B64" | base64 -d > requester-state.json
                  printf '%s' "$PATCHWORK_E2E_HELPER_STATE_B64" | base64 -d > helper-state.json
                  printf '%s' "$PATCHWORK_E2E_MAINTAINER_STATE_B64" | base64 -d > maintainer-state.json
                  export PATCHWORK_E2E_REQUESTER_STATE="$PWD/requester-state.json"
                  export PATCHWORK_E2E_HELPER_STATE="$PWD/helper-state.json"
                  export PATCHWORK_E2E_MAINTAINER_STATE="$PWD/maintainer-state.json"
                  if ! npm run test:e2e -w @patchwork/web -- e2e/staging-release-lifecycle.spec.ts; then
                    npm run test:e2e:redact
                    exit 1
                  fi
                  npm run test:e2e:redact
            - name: Remove staging credentials
              if: always()
              run: rm -f ~/.ssh/id_ed25519 requester-state.json helper-state.json maintainer-state.json
