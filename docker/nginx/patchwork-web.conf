server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets — immutable, cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Versioned PMTiles artifacts from the mounted tile directory.
    location ~ "^/tiles/(?<pmtiles_file>us\.[0-9a-f]{64}\.pmtiles)$" {
        alias /srv/patchwork-map/$pmtiles_file;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges bytes always;
    }

    location = /tiles/us.pmtiles {
        return 404;
    }

    location = /nearby { return 308 /map$is_args$args; }
    location = /activity { return 308 /inbox$is_args$args; }
    location ~ ^/(?:login|signup|auth/callback|admin/invites|posting|requests/(?:view|mine)|chat|settings|moderation|inbox|notifications|scheduling|groups|verification)$ {
        try_files /app.html =404;
    }
    location = /app.html {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    }

    # index.html and other non-hashed files — never cache
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
        try_files $uri $uri/index.html =404;
    }
}
