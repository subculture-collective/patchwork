groups:
  - name: patchwork-staging-critical
    rules:
      - alert: PatchworkApiErrorRateHigh
        expr: sum(rate(patchwork_sli_error_total{service="api",environment="staging"}[5m])) / clamp_min(sum(rate(patchwork_sli_request_total{service="api",environment="staging"}[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: critical, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#api-error-rate" }
      - alert: PatchworkIndexerDisconnected
        expr: patchwork_event_source_connected{service="indexer",environment="staging"} == 0
        for: 2m
        labels: { severity: critical, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#indexer-disconnect-or-lag" }
      - alert: PatchworkIndexerLagHigh
        expr: patchwork_event_source_lag_seconds{service="indexer",environment="staging"} > 300
        for: 5m
        labels: { severity: critical, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#indexer-disconnect-or-lag" }
      - alert: PatchworkModerationQueueOldestItemHigh
        expr: moderation_queue_oldest_item_age_seconds{service="moderation-worker",environment="staging"} > 900
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#moderation-queue-age" }
      - alert: PatchworkUrgentModerationNotificationPending
        expr: moderation_urgent_notification_events_pending{service="moderation-worker",environment="staging"} > 0
        for: 5m
        labels: { severity: critical, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#moderation-queue-age" }
      - alert: PatchworkMaintenanceModeActive
        expr: patchwork_maintenance_mode_active{service="api",environment="staging"} == 1
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#maintenance-mode" }
      - alert: PatchworkChatRouteErrors
        expr: sum(increase(patchwork_http_route_error_total{service="api",environment="staging",endpoint=~"/chat/.*"}[10m])) > 0
        for: 2m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#api-error-rate" }
      - alert: PatchworkDiscoveryRouteErrors
        expr: sum(increase(patchwork_http_route_error_total{service="api",environment="staging",endpoint=~"/query/(map|feed|directory|volunteers)"}[10m])) > 0
        for: 2m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#api-error-rate" }
      - alert: PatchworkProjectionLagHigh
        expr: patchwork_event_source_lag_seconds{service="indexer",environment="staging"} > 60
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#indexer-disconnect-or-lag" }
      - alert: PatchworkMaintenanceStepUpDenied
        expr: sum(increase(patchwork_http_route_request_total{service="api",environment="staging",endpoint=~"/maintenance/(declare|resume)",outcome="4xx"}[10m])) > 5
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#maintenance-mode" }
      - alert: PatchworkDatabaseUnavailable
        expr: up{job="patchwork-postgres",environment="staging"} == 0
        for: 1m
        labels: { severity: critical, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#database-unavailable" }
      - alert: PatchworkSourceRefreshFailed
        expr: patchwork_source_refresh_last_attempt_success{source="cpl",environment="staging"} == 0
        for: 1m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#source-refresh" }
      - alert: PatchworkSourceRefreshStale
        expr: time() - patchwork_source_refresh_last_success_timestamp_seconds{source="cpl",environment="staging"} > 129600 or absent(patchwork_source_refresh_last_success_timestamp_seconds{source="cpl",environment="staging"})
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#source-refresh" }
      - alert: PatchworkRoutingUnavailable
        expr: up{job="patchwork-routing",environment="staging"} == 0
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#travel-routing" }
      - alert: PatchworkTravelRouteErrors
        expr: sum(increase(patchwork_http_route_error_total{service="api",environment="staging",endpoint="/travel/plan"}[15m])) > 2
        for: 2m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#travel-routing" }
      - alert: PatchworkBackupFailed
        expr: patchwork_backup_last_attempt_success{environment="staging"} == 0
        for: 1m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/disaster-recovery.md#backup-monitoring" }
      - alert: PatchworkBackupStale
        expr: time() - patchwork_backup_last_success_timestamp_seconds{environment="staging"} > 27000
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/disaster-recovery.md#backup-monitoring" }
      - alert: PatchworkIndependentBackupFailed
        expr: patchwork_independent_backup_last_attempt_success{environment="staging"} == 0 or absent(patchwork_independent_backup_last_attempt_success{environment="staging"})
        for: 1m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/disaster-recovery.md#independent-database-and-private-object-replication" }
      - alert: PatchworkIndependentBackupStale
        expr: time() - patchwork_independent_backup_last_success_timestamp_seconds{environment="staging"} > 27000 or absent(patchwork_independent_backup_last_success_timestamp_seconds{environment="staging"})
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/disaster-recovery.md#independent-database-and-private-object-replication" }
      - alert: PatchworkRetentionFailed
        expr: patchwork_retention_last_attempt_success{service="api",environment="staging"} == 0
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#retention-enforcement" }
      - alert: PatchworkRetentionStale
        expr: time() - patchwork_retention_last_success_timestamp_seconds{service="api",environment="staging"} > 7200
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#retention-enforcement" }
      - alert: PatchworkAttachmentDeletionFailed
        expr: patchwork_attachment_deletion_failures_pending{service="api",environment="staging"} > 0
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#private-attachment-deletion" }
      - alert: PatchworkAttachmentPipelineSweepFailed
        expr: increase(patchwork_attachment_pipeline_sweep_failures_total{service="api",environment="staging"}[15m]) > 0
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#private-attachment-deletion" }
      - alert: PatchworkNotificationDeadLetter
        expr: patchwork_notification_delivery_dead_letters{service="api",environment="staging"} > 0
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#notification-delivery" }
      - alert: PatchworkNotificationDeliveryStale
        expr: patchwork_notification_delivery_oldest_pending_seconds{service="api",environment="staging"} > 900
        for: 10m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#notification-delivery" }
      - alert: PatchworkNotificationSweepFailed
        expr: increase(patchwork_notification_delivery_sweep_failures_total{service="api",environment="staging"}[15m]) > 0
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#notification-delivery" }
      - alert: PatchworkModerationRetentionFailed
        expr: moderation_retention_last_attempt_success{service="moderation-worker",environment="staging"} == 0
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#retention-enforcement" }
      - alert: PatchworkModerationRetentionStale
        expr: time() - moderation_retention_last_success_timestamp_seconds{service="moderation-worker",environment="staging"} > 7200
        for: 5m
        labels: { severity: warning, owner: patchwork-primary-on-call }
        annotations: { runbook_url: "docs/operations/incident-response.md#retention-enforcement" }
